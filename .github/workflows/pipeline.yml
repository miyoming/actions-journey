name: dependent-jobs
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{  steps.ver.outputs.version  }}
    steps:
      - name: build stage
        id: ver
        run: | 
          echo "version=${{  github.sha  }}" >> "$GITHUB_OUTPUT"
          hostname

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: echo test stage
        run: | 
          echo "test stage - ${{  needs.build.outputs.version  }}"
          hostname

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: output from build stage
        run: | 
          echo "Deploying ${{  needs.build.outputs.version  }}"
          hostname

