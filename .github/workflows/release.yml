name: fan out-in
on:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: echo lint
        run: echo "lint"
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: echo unit-tests
        run: echo "unit-tests"
  package:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: echo package
        run: echo "packaging"
  secret_reusable:
    uses: ./.github/workflows/notify.yml
    secrets:
      NOTIFY_TOKEN: ${{  secrets.NOTIFY_TOKEN  }}
    with:
      environment: pixel-post
